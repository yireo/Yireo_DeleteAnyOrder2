modified: "2026-11-25T00:00:00Z"
aliases: []
summary: Cross-Site Request Forgery allows deleting orders and running the database fix in the Admin Panel
details: >
  In versions up to and including 1.0.8 the admin controllers to delete an order, to mass delete orders and to
  fix the database (Delete, MassDelete and Fix) accepted GET requests without validating a form key. An attacker
  who got a logged-in admin user to open a crafted URL could permanently delete orders or trigger the database
  fix, which in these versions could also delete related rows of existing orders. Exploitation is harder when the
  Magento setting "Add Secret Key to URLs" is enabled. Version 1.1.0 only accepts POST requests with a valid form
  key for these actions, checks dedicated ACL resources (Yireo_DeleteAnyOrder2::delete_order and
  Yireo_DeleteAnyOrder2::fix) and only fixes orphaned rows. Users of older versions should upgrade.
